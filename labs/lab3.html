<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 3</title>

    <style>
        .image-preview img {
            width: 160px;
            height: 200px;
            border: 20px solid;
            border-color: skyblue lightpink lightgreen papayawhip;
        }

        p > span { color: red; }
        #header span { color: pink; }
        span { color: green; }

        table { border-collapse: collapse; }
        th, td { border: 1px solid black; padding: 5px; }
    </style>
</head>
<body>
<div class="image-preview">

<table>

        <th>Element</th>
        <th>Color</th>
        <th>Color when mouse over</th>
    </tr>
    <tr>
        <td>span.myclass1</td>
        <td>Pink</td>
        <td>Blue</td>
    </tr>
    <tr>
        <td>span.myclass2</td>
        <td>Pink</td>
        <td>Pink</td>
    </tr>
    <tr>
        <td>span.myclass3</td>

    </tr>
    <tr>

</html>
